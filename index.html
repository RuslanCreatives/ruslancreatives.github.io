<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Руслан — дизайнер продуктов</title>
<meta name="description" content="Портфолио Руслана — продуктового дизайнера, который хочет делать AI-продукты. Сделано в виде AI-чата.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #FFFFFF; --side: #F7F7F8; --elev: #FFFFFF; --soft: #EFEFF1; --line: #E4E4E7;
  --text: #0D0D0F; --muted: #5E5E66; --faint: #8E8E96;
  --accent: #D4FF3A; --on-accent: #10110C; --accent-text: #5F7A00;
  --violet: #7B61FF; --orange: #FF6B3D;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 28px rgba(0,0,0,.07);
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Onest', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F0F0D; --side: #151513; --elev: #1C1C19; --soft: #22221F; --line: #2B2B27;
  --text: #EDEBE4; --muted: #8E8B81; --faint: #5F5D56;
  --accent-text: #D4FF3A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 40px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F0D; --side: #151513; --elev: #1C1C19; --soft: #22221F; --line: #2B2B27;
    --text: #EDEBE4; --muted: #8E8B81; --faint: #5F5D56;
    --accent-text: #D4FF3A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 40px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
::selection { background: var(--accent); color: var(--on-accent); }
.mono { font-family: var(--mono); }
svg { flex-shrink: 0; }

.app { display: grid; grid-template-columns: 280px 1fr auto; position: fixed; top: 0; left: 0; right: 0; bottom: 0; }

/* ---------- sidebar ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 30; }
.side-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 14px 10px 18px; }
.logo { display: flex; border-radius: 8px; padding: 2px 6px 2px 0; transition: opacity .15s; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.02em; font-size: 17px; }
.logo:hover { opacity: .75; }
.logo .ver { font: 500 10px var(--mono); padding: 2px 6px; border-radius: 6px; background: var(--accent); color: var(--on-accent); }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--text); }
.new-chat { margin: 6px 12px 10px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--elev); font-weight: 500; transition: transform .15s; }
.new-chat:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.new-chat kbd { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
.nav { flex: 1; overflow-y: auto; padding: 4px 12px 16px; scrollbar-width: thin; }
.group-h { display: flex; align-items: center; gap: 6px; width: 100%; padding: 14px 10px 6px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.group-h svg { transition: transform .2s; }
.group.closed .group-h svg { transform: rotate(-90deg); }
.group.closed .items { display: none; }
.item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px; color: var(--muted); font-size: 14px; transition: background .12s, color .12s; }
.item:hover { background: var(--soft); color: var(--text); }
.item.active { background: var(--soft); color: var(--text); }
.item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex-shrink: 0; transition: background .3s; }
.item.seen .dot { background: var(--accent-text); }
.item .meta { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
.item.typing .meta::after { content: '●●●'; letter-spacing: 2px; animation: blink 1s infinite; color: var(--accent-text); }
.item.typing .meta span { display: none; }

.ctx { margin: 0 12px 10px; padding: 12px; border-radius: 12px; border: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
.ctx-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; margin-bottom: 8px; }
.ctx-bar { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.ctx-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--accent)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.ctx-done { display: none; margin-top: 8px; color: var(--text); }
.ctx.full .ctx-done { display: block; }

.profile { position: relative; border-top: 1px solid var(--line); padding: 10px; }
.profile-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 12px; text-align: left; }
.profile-btn:hover { background: var(--soft); }
.ava { width: 36px; height: 36px; border-radius: 10px; background: var(--accent) center/cover; display: grid; place-items: center; font-weight: 700; color: var(--on-accent); flex-shrink: 0; }
.profile-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
.profile-plan { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.profile-plan::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #3BD16F; box-shadow: 0 0 0 3px rgba(59,209,111,.18); }
.menu { position: absolute; left: 10px; right: 10px; bottom: calc(100% - 4px); background: var(--elev); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 8px; opacity: 0; transform: translateY(6px) scale(.98); pointer-events: none; transition: .18s; transform-origin: bottom; }
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.menu-label { font: 500 11px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .08em; padding: 8px 8px 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--soft); padding: 3px; border-radius: 10px; margin: 0 4px 6px; }
.seg button { padding: 6px 4px; border-radius: 8px; font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; }
.seg button.on { background: var(--elev); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.seg.two { grid-template-columns: 1fr 1fr; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 8px; font-size: 13px; text-align: left; text-decoration: none; }
.menu-item:hover { background: var(--soft); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

/* ---------- main ---------- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; position: relative; z-index: 5; }
.burger { display: none; }
.model-btn { margin-left: auto; display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--muted); }
.model-btn:hover { background: var(--soft); color: var(--text); }
.model-menu { position: absolute; bottom: calc(100% + 8px); right: 0; width: 340px; z-index: 10; background: var(--elev); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; opacity: 0; transform: translateY(6px); pointer-events: none; transition: .18s; }
.model-menu.open { opacity: 1; transform: none; pointer-events: auto; }
.model-opt { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; }
.model-opt:hover:not(:disabled) { background: var(--soft); }
.model-opt b { font-weight: 600; font-size: 14px; }
.model-opt small { grid-column: 1; color: var(--muted); font-size: 12px; line-height: 1.4; }
.model-opt .check { grid-row: 1 / 3; grid-column: 2; align-self: center; opacity: 0; color: var(--accent-text); }
.model-opt.on .check { opacity: 1; }
.model-opt:disabled { cursor: not-allowed; }
.model-opt:disabled b, .model-opt:disabled small { opacity: .55; }
.badge { font: 500 10px var(--mono); padding: 2px 6px; border-radius: 5px; background: var(--soft); color: var(--muted); margin-left: 6px; vertical-align: 2px; }
.badge.hot { background: var(--accent); color: var(--on-accent); }
.top-right { margin-left: auto; display: flex; gap: 6px; }
.pill-btn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; }
.pill-btn:hover { background: var(--soft); }

.scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; min-height: 0; }
.col { max-width: 760px; margin: 0 auto; padding: 8px 24px 40px; }

/* home */
.home { min-height: calc(100% - 40px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 24px; }
.home h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.08; letter-spacing: -.035em; font-weight: 600; margin: 0 0 12px; max-width: 640px; }
.home p { text-wrap: balance; color: var(--muted); max-width: 500px; margin: 0 0 32px; font-size: 16px; }
.sugg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 620px; }
.sugg button { text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--elev); transition: .18s; display: flex; flex-direction: column; gap: 2px; }
.sugg button:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--faint); }
.sugg b { font-weight: 500; font-size: 14px; }
.sugg small { color: var(--muted); font-size: 12px; }

@keyframes blink { 50% { opacity: .3; } }

/* messages */
.thread { display: none; }
.thread.show { display: block; }
.home.thread.show { display: flex; }
.msg-user { display: flex; justify-content: flex-end; margin: 28px 0 20px; animation: rise .35s ease; }
.msg-user div { background: var(--soft); padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 80%; }
.msg-ai { margin-bottom: 12px; }
.msg-ai .body { min-width: 0; padding-top: 2px; }
.body > * { animation: rise .4s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.body p { margin: 0 0 14px; }
.body h3 { margin: 26px 0 10px; font-size: 13px; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.body h3::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.body b, .body strong { font-weight: 600; }
.body mark { background: var(--accent); color: var(--on-accent); padding: 0 4px; border-radius: 4px; }
.body a.inl { color: var(--accent-text); text-underline-offset: 3px; }
.body ul, .body ol { margin: 0 0 14px; padding-left: 0; list-style: none; counter-reset: li; }
.body li { position: relative; padding-left: 30px; margin-bottom: 8px; }
.body ol li::before { counter-increment: li; content: counter(li, decimal-leading-zero); position: absolute; left: 0; top: 2px; font: 500 11px var(--mono); color: var(--accent-text); }
.body ul li::before { content: '→'; position: absolute; left: 4px; color: var(--accent-text); }
.caret::after { content: ''; display: inline-block; width: 8px; height: 15px; background: var(--text); margin-left: 2px; vertical-align: -2px; border-radius: 2px; animation: blink .7s infinite; }

.thinking { margin-bottom: 14px; font-size: 14px; }
.thinking-h { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 2px 0; color: var(--muted); text-align: left; transition: color .15s; }
.thinking-h:hover { color: var(--text); }
.thinking-h svg { transition: transform .2s; transform: rotate(-90deg); }
.thinking.open .thinking-h svg { transform: none; }
.thinking-h .shimmer { background: linear-gradient(90deg, var(--muted) 30%, var(--text) 50%, var(--muted) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.4s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.thinking-b { display: none; margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 32px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.thinking.open .thinking-b { display: block; }
.thinking-b div { padding: 3px 0; position: relative; animation: rise .3s ease; }
.thinking-b div::before { content: ''; position: absolute; left: -18px; top: 11px; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--faint); }

.actions { display: flex; align-items: center; gap: 2px; margin: 4px 0 8px -6px; opacity: 0; transition: opacity .3s; }
.actions.show { opacity: 1; }
.actions .icon-btn { width: 30px; height: 30px; }
.actions .icon-btn.on { color: var(--accent-text); }
.follow { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px 42px; }
.follow button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); transition: .15s; animation: rise .4s ease both; }
.follow button:hover { color: var(--text); border-color: var(--text); }

/* blocks */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 4px 0 18px; }
.stat { background: var(--elev); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stat b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.35; display: block; margin-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.tag { font: 12px var(--mono); padding: 4px 9px; border-radius: 7px; background: var(--soft); color: var(--muted); }
.tag.hi { background: var(--accent); color: var(--on-accent); }

.case { display: grid; grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--elev); margin: 0 0 18px; cursor: pointer; transition: .2s; text-align: left; width: 100%; }
.case:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.case-img { aspect-ratio: 16/8.5; background: var(--soft) center/cover no-repeat; position: relative; }
.case-img::after { content: 'Открыть все экраны ↗'; position: absolute; right: 12px; bottom: 12px; font: 500 12px var(--mono); background: var(--elev); color: var(--text); padding: 6px 10px; border-radius: 8px; opacity: 0; transform: translateY(4px); transition: .2s; }
.case:hover .case-img::after { opacity: 1; transform: none; }
.case-b { padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.case-b b { font-size: 16px; font-weight: 600; display: block; }
.case-b small { color: var(--muted); font-size: 13px; }
.case-b .yr { font: 12px var(--mono); color: var(--faint); white-space: nowrap; }
.cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.cases-grid .case { margin: 0; }
.cases-grid .case-img { aspect-ratio: 16/10; }
.cases-grid .case-b { align-items: flex-start; }

.segs { margin: 0 0 18px; }
.seg-bar { display: flex; height: 40px; border-radius: 10px; overflow: hidden; gap: 3px; }
.seg-bar i { display: grid; place-items: center; font: 500 12px var(--mono); color: var(--on-accent); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); white-space: nowrap; overflow: hidden; }
.seg-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.seg-leg span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 6px; }

.compare { border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 18px; background: var(--elev); }
.compare-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.cmp-row { display: grid; grid-template-columns: 90px 1fr 54px; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 8px; }
.cmp-row .tr { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.cmp-row .tr i { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--faint); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.cmp-row.after .tr i { background: linear-gradient(90deg, var(--violet), var(--accent)); }
.cmp-row b { font-family: var(--mono); font-weight: 500; text-align: right; }

.tool { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 8px; border-radius: 10px; background: var(--soft); font: 12px var(--mono); color: var(--muted); margin: 0 0 14px; }
.tool .st { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--faint); border-top-color: var(--accent-text); animation: spin .7s linear infinite; }
.tool.done .st { border: 0; animation: none; background: var(--accent); display: grid; place-items: center; }
.tool.done .st::after { content: '✓'; font-size: 10px; color: var(--on-accent); font-weight: 700; }
.tool code { color: var(--text); }
@keyframes spin { to { transform: rotate(360deg); } }

.card { border: 1px solid var(--line); border-radius: 16px; background: var(--elev); padding: 16px; margin: 0 0 16px; }
.contact { display: flex; align-items: center; gap: 14px; }
.contact .ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--soft); }
.contact b { display: block; font-size: 16px; }
.contact small { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 500; font-size: 14px; text-decoration: none; transition: .15s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); }
.btn.acc { background: var(--accent); color: var(--on-accent); }
.gallery-acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.contact .btn { margin-left: auto; }
.contact-acts { margin-left: auto; display: flex; gap: 8px; }
.contact .contact-acts .btn { margin-left: 0; }

.doc { display: grid; grid-template-columns: 130px 1fr; gap: 18px; align-items: center; }
.doc-page { aspect-ratio: 1/1.41; background: #fff; border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,.15); padding: 12px 10px; display: flex; flex-direction: column; gap: 5px; transform: rotate(-3deg); transition: transform .3s; }
.card:hover .doc-page { transform: rotate(0) scale(1.04); }
.doc-page i { height: 4px; border-radius: 2px; background: #E2E0DA; }
.doc-page i.h { height: 8px; width: 60%; background: #161614; margin-bottom: 4px; }
.doc-page i.a { background: #D4FF3A; width: 40%; }
.doc b { font-size: 16px; display: block; }
.doc small { color: var(--muted); display: block; margin: 2px 0 12px; font-size: 13px; }




/* lamoda calendar */
.cal { border: 1px solid var(--line); border-radius: 16px; background: var(--elev); padding: 14px; margin: 0 0 18px; }
.cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
.cal-top b { font-size: 14px; }
.cal .seg { margin: 0; width: 200px; }
.cal-dow, .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-dow span { font: 10px var(--mono); color: var(--faint); text-transform: uppercase; padding: 0 4px 6px; }
.cal-week { border-top: 1px solid var(--line); grid-auto-rows: min-content; padding-bottom: 6px; min-height: 58px; }
.cal-week .d { font: 11px var(--mono); color: var(--muted); padding: 4px; grid-row: 1; }
.cal-week .d.off { color: var(--faint); opacity: .5; }
.promo { font-size: 11px; line-height: 1; padding: 5px 6px; margin: 2px 2px 0; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: clip; color: #fff; transition: background .4s, color .4s, opacity .4s; }
.cal.v2 .promo { text-overflow: ellipsis; }
.cal.v2 .promo.yes { background: var(--accent) !important; color: var(--on-accent); }
.cal.v2 .promo.no { background: var(--soft) !important; color: var(--text); }
.cal.v2 .promo.done { background: transparent !important; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.cal.v2 .promo.skip { display: none; }
.cal.v2 .promo i { display: none; }
.cal-leg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.cal-leg span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; box-shadow: inset 0 0 0 1px var(--line); }
.cal.v2 .leg1, .cal:not(.v2) .leg2 { display: none; }
.cal-note { font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }

/* composer */

.chips button:hover { color: var(--text); border-color: var(--text); }
.box { position: relative; background: var(--elev); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 12px 12px 12px 18px; transition: border-color .2s; }

.send:disabled { opacity: .25; cursor: default; }
.send.stop { background: var(--text); }
.disclaimer { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 8px; }
.slash { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: var(--elev); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: none; max-height: 300px; overflow-y: auto; z-index: 10; }
.slash.open { display: block; }
.slash-h { font: 500 11px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .08em; padding: 6px 10px 4px; }
.slash button { display: flex; gap: 12px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 13px; }
.slash button.on, .slash button:hover { background: var(--soft); }
.slash code { font-family: var(--mono); font-weight: 500; color: var(--accent-text); min-width: 90px; }
.slash span { color: var(--muted); }

/* artifact panel */
.artifact { width: 0; overflow: hidden; border-left: 0 solid var(--line); background: var(--side); transition: width .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; min-height: 0; }
.app.art-open .artifact { width: min(46vw, 640px); border-left-width: 1px; }
.art-h { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); min-width: 360px; }
.art-h .t { font-weight: 600; font-size: 14px; }
.art-h .s { font: 11px var(--mono); color: var(--faint); }
.art-h .r { margin-left: auto; display: flex; gap: 4px; }
.art-b { flex: 1; overflow-y: auto; padding: 18px; min-width: 360px; }

.art-b img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.art-b figcaption { padding: 8px 12px; font: 11px var(--mono); color: var(--faint); }

.lightbox { position: fixed; inset: 0; background: rgba(5,5,4,.88); z-index: 100; display: none; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox.open { display: grid; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--elev); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 10px 16px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; max-width: calc(100vw - 32px); }

const Sound = {
  on: store.get('sound', true), ctx: null, out: null, last: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000;
      this.out = this.ctx.createGain(); this.out.gain.value = 0.9;
      this.out.connect(lp).connect(this.ctx.destination);
    } catch { this.ctx = null; }
  },
  tone(f, to, dur, vol, type = 'sine', delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out);
    o.start(t); o.stop(t + dur + 0.03);
  },
  whoosh(dur, vol, from, to) {
    const c = this.ctx, t = c.currentTime;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g).connect(this.out);
    src.start(t); src.stop(t + dur);
  },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    const now = performance.now();
    if (name === 'hover') { if (now - this.last < 45) return; this.last = now; this.tone(2400, 1900, 0.04, 0.016, 'triangle'); }
    if (name === 'click') { this.tone(560, 260, 0.09, 0.07); this.tone(1400, null, 0.025, 0.012, 'triangle'); }
    if (name === 'console') {
      this.whoosh(0.2, 0.05, 500, 3200);
      this.tone(330, 660, 0.12, 0.035);
      this.tone(990, null, 0.09, 0.03, 'triangle', 0.1);
      this.tone(1480, null, 0.14, 0.02, 'sine', 0.15);
    }
  },
};
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => Sound.init(), { capture: true }));

function syncNav() {

// ===== intent matching =====
function route(text) {
  const s = text.toLowerCase().replace(/ё/g, 'е');
  const has = (...w) => w.some(x => s.includes(x));
  if (has('ignore', 'игнорир', 'system prompt', 'системный промпт', 'забудь все', 'jailbreak')) return 'jailbreak';
  if (has('зарплат', 'деньг', 'сколько стоишь', 'вилк', 'salary', 'ставк')) return 'money';
  if (has('озон', 'ozon', 'chatzone', 'meet', 'видеоконф', 'watchzone')) return 'ozon';
  if (has('ламод', 'lamoda', 'seller', 'селлер', 'календар', 'акци')) return 'lamoda';
  if (has('сбер', 'sber', 'triplex', 'триплекс', 'банк')) return 'sber';
  if (has('симетр', 'simetra', 'ритм', 'ritm', 'транспорт', 'город')) return 'simetra';
  if (has('cv', 'резюме', 'resume', 'pdf')) return 'cv';
  if (has('почт', 'email', 'e-mail', 'mail', 'письм')) return 'mail';
  if (has('linkedin', 'линкед')) return 'linkedin';
  if (has('телеграм', 'telegram', 'tg', 'тг', 'связат', 'контакт', 'написать', 'созвон')) return 'telegram';
  if (has('кейс', 'работ', 'проект', 'портфол', 'покажи')) return 'works';
  if (has('кто', 'о себе', 'расскаж', 'опыт', 'about')) return 'about';
  if (/^(привет|здравств|hi|hello|хай|добр)/.test(s.trim())) return 'hello';
  return 'unknown';
}

// ===== chat engine =====
async function ask(text, routeId) {
  if (S.busy) return;
  const el = threadEl();
  const u = h('div', 'msg-user'); u.append(h('div', '', esc(text)));
  el.append(u);
  const id = routeId || route(text);
  const def = R[id] || EXTRA[id];
  if (ALL.includes(id) || id === 'works') markSeen(id);
  await answer(el, id, def);
}

async function answer(el, id, def, reuse) {
  S.busy = true; S.stop = false; stick = true; setSendState(); setChips([]);
  const navItem = document.querySelector(`.item[data-id="${S.current}"]`);
  navItem && navItem.classList.add('typing');
  const wrap = reuse || h('div', 'msg-ai');
  wrap.innerHTML = '';
  const body = h('div', 'body');
  wrap.append(body);
  if (!reuse) el.append(wrap);
  scrollDown();

  // размышления
  const th = h('div', 'thinking');
  const thHead = h('button', 'thinking-h', `<span class="shimmer">Размышляю…</span>${ICON.chev}`);
  const thLabel = thHead.firstChild;
  const thBody = h('div', 'thinking-b');
  th.append(thHead, thBody);
  thHead.onclick = () => th.classList.toggle('open');
  body.append(th);
  const t0 = performance.now();
  for (const step of def.think || []) {
    await wait(380 + Math.random() * 300);
    thBody.append(h('div', '', step));
    thLabel.textContent = step;
    scrollDown();
  }
  await wait(300);
  const secs = Math.max(0.4, (performance.now() - t0) / 1000).toFixed(1);
  thHead.innerHTML = `Размышлял ${secs} с${ICON.chev}`;
  th.classList.remove('open');

  for (const b of def.blocks) {
    const node = renderBlock(b);
    if (!node) continue;
    body.append(node);
    if (b.t === 'p') await typeOut(node);
    else { await wait(160); activate(node, b); }
    scrollDown();
  }

  // действия
  const acts = h('div', 'actions');
  const copy = h('button', 'icon-btn', ICON.copy); copy.title = 'Копировать';
  copy.onclick = () => { navigator.clipboard?.writeText(body.innerText.replace(/^Размышлял.*\n/, '')).then(() => toast('Скопировано')).catch(() => toast('Не удалось скопировать')); };
  const regen = h('button', 'icon-btn', ICON.regen); regen.title = 'Перегенерировать';
  regen.onclick = () => { if (S.busy) return; answer(el, id, def, wrap); };
  const up = h('button', 'icon-btn', ICON.up); up.title = 'Хороший ответ';
  const down = h('button', 'icon-btn', ICON.down); down.title = 'Плохой ответ';
  up.onclick = () => { up.classList.toggle('on'); down.classList.remove('on'); if (up.classList.contains('on')) toast('Спасибо! Передам Руслану, он будет доволен'); };
  down.onclick = () => { down.classList.toggle('on'); up.classList.remove('on'); if (down.classList.contains('on')) toast('Принято. Лучший фидбек — в Telegram, Руслан правда читает'); };
  acts.append(copy, regen, up, down);
  wrap.querySelector('.body').append(acts);
  requestAnimationFrame(() => acts.classList.add('show'));

  navItem && navItem.classList.remove('typing');
  S.busy = false; S.stop = false; setSendState();
  if (el.classList.contains('show')) setChips(def.follow || ['about', 'works', 'telegram']);
  scrollDown();
  fillPending();
}

async function typeOut(node) {
  if (S.speed === 'instant' || S.stop) return;
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  const texts = [];
  while (walker.nextNode()) texts.push([walker.currentNode, walker.currentNode.textContent]);
  texts.forEach(([n]) => n.textContent = '');
  node.classList.add('caret');
  for (const [n, full] of texts) {
    const words = full.split(/(\s+)/);
    let acc = '';
    for (let i = 0; i < words.length; i++) {
      if (S.stop) { n.textContent = full; break; }
      acc += words[i];
      n.textContent = acc;
      if (i % 2 === 0) await new Promise(r => setTimeout(r, 14 + Math.random() * 30));
    }
  }
  texts.forEach(([n, full]) => n.textContent = full);
  node.classList.remove('caret');
}

// автоскролл, пока пользователь сам не прокрутил вверх
let stick = true;
const scEl = $('#scroll');
['wheel', 'touchmove', 'keydown'].forEach(ev => scEl.addEventListener(ev, () => requestAnimationFrame(() => { stick = scEl.scrollHeight - scEl.scrollTop - scEl.clientHeight < 80; }), { passive: true }));
function scrollDown() { if (stick) scEl.scrollTop = scEl.scrollHeight; }

// ===== блоки =====
function renderBlock(b) {
  switch (b.t) {
    case 'p': return h('p', '', b.h);
    case 'h': return h('h3', '', b.h);
    case 'ol': return h('ol', '', b.items.map(i => `<li>${i}</li>`).join(''));
    case 'tags': return h('div', 'tags', b.items.map(t => `<span class="tag${t.startsWith('→') ? ' hi' : ''}">${t}</span>`).join(''));
    case 'stats': return h('div', 'stats', b.items.map(([v, suf, l]) => `<div class="stat"><b data-v="${v}" data-s="${suf}">${/^\d+$/.test(v) ? '0' : v}${suf}</b><span>${l}</span></div>`).join(''));
    case 'segs': return h('div', 'segs', `<div class="seg-bar">${b.items.map(([p, , c]) => `<i style="background:${c}" data-w="${Math.max(p, 2)}">${p > 5 ? p + '%' : ''}</i>`).join('')}</div><div class="seg-leg">${b.items.map(([p, l, c]) => `<span style="--c:${c}">${l} — ${p < 2 ? '<1' : p}%</span>`).join('')}</div>`);
    case 'compare': return h('div', 'compare', `<div class="compare-h"><span>${b.title}</span><span class="mono">${b.note}</span></div>
      <div class="cmp-row"><span>До</span><div class="tr"><i data-w="${b.from}"></i></div><b>${b.from}%</b></div>
      <div class="cmp-row after"><span>После</span><div class="tr"><i data-w="${b.to}"></i></div><b data-v="${b.to}" data-s="%">0%</b></div>`);
    case 'case': return caseEl(b.id);
    case 'cases': { const g = h('div', 'cases-grid'); Object.keys(CASES).forEach(id => g.append(caseEl(id, true))); return g; }
    case 'gallery': {
      const d = h('div', 'gallery-acts', `<button class="btn acc">${ICON.arrow} Открыть все экраны · ${GALLERY[b.id].imgs.length}</button>${b.site ? `<a class="btn ghost" href="${b.site}" target="_blank" rel="noopener">Сайт проекта ${ICON.arrow}</a>` : ''}`);
      d.firstChild.onclick = () => openArtifact(b.id);
      return d;
    }
    case 'tool': return h('div', 'tool', `<span class="st"></span>Использую инструмент <code>${b.name}</code>(${b.arg})`);
    case 'contact': {
      const tg = b.kind === 'tg';
      const url = tg ? 'https://t.me/' + CONFIG.telegram : CONFIG.linkedin;
      return h('div', 'card contact', `<div class="ic">${tg ? ICON.tg : ICON.li}</div><div><b>${tg ? 'Telegram' : 'LinkedIn'}</b><small>${tg ? '@' + CONFIG.telegram : 'in/ruslandesign'}</small></div><a class="btn acc" href="${url}" target="_blank" rel="noopener">${tg ? 'Написать' : 'Открыть профиль'} ${ICON.arrow}</a>`);
    }
    case 'email': {
      const c = h('div', 'card contact', `<div class="ic">${ICON.mail}</div><div><b>Почта</b><small>${CONFIG.email}</small></div><div class="contact-acts"><button class="btn ghost" data-a="copy">Скопировать адрес</button><a class="btn acc" href="mailto:${CONFIG.email}">Открыть в почте ${ICON.arrow}</a></div>`);
      c.querySelector('[data-a=copy]').onclick = () => navigator.clipboard?.writeText(CONFIG.email).then(() => toast('Адрес скопирован')).catch(() => toast('Не удалось скопировать'));
      return c;
    }
    case 'cv': return h('div', 'card doc', `<div class="doc-page"><i class="h"></i><i class="a"></i><i></i><i></i><i style="width:80%"></i><i></i><i style="width:60%"></i><i></i><i></i><i style="width:70%"></i><i></i><i style="width:50%"></i></div>
      <div><b>Руслан — Product Designer</b><small>PDF · Ozon, Lamoda, Сбер, Simetra · 8+ лет</small><a class="btn" href="${CONFIG.cv}" target="_blank" rel="noopener">Открыть CV ${ICON.arrow}</a></div>`);
    case 'cal': return calendar();
  }
}
function caseEl(id, compact) {
  const [t, d, y] = CASES[id];
  const c = h('button', 'case', `<div class="case-img" style="background-image:url('${COVERS[id]}')"></div><div class="case-b"><div><b>${t}</b><small>${d}</small></div><span class="yr">${y}</span></div>`);
  c.onclick = () => compact && S.current !== id && !threads[id] ? open(id) : openArtifact(id);
  return c;
}
function activate(node, b) {
  requestAnimationFrame(() => {
    node.querySelectorAll('[data-w]').forEach(i => i.style.width = i.dataset.w + '%');
    node.querySelectorAll('b[data-v]').forEach(el => countUp(el));
  });
  if (b.t === 'tool') setTimeout(() => node.classList.add('done'), S.speed === 'instant' || S.stop ? 0 : 700);
}
function countUp(el) {
  const v = el.dataset.v, s = el.dataset.s || '';
  if (!/^\d+$/.test(v)) return;
  const target = +v;
  if (S.speed === 'instant' || S.stop) { el.textContent = target + s; return; }
  const t0 = performance.now(), dur = 1100;
  const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))) + s; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// Lamoda: интерактивный календарь v1 / v2
function calendar() {
  const promos = [
    { n: 'Осенний гардероб: скидки до 50% на верхнюю одежду', s: 1, e: 9, c: '#E0702F', i: '◆', st: 'done' },
    { n: 'Неделя обуви', s: 4, e: 12, c: '#3A7BD5', i: '▲', st: 'skip' },
    { n: 'Beauty-неделя', s: 13, e: 19, c: '#D14F9A', i: '♥', st: 'yes' },
    { n: 'Детская одежда и аксессуары для школы', s: 15, e: 23, c: '#2EA36B', i: '●', st: 'no' },
    { n: 'Спорт-марафон', s: 17, e: 21, c: '#8A5CF6', i: '★', st: 'no' },
    { n: 'Чёрная пятница', s: 24, e: 30, c: '#111', i: '■', st: 'yes' },
    { n: 'Предновогодний старт', s: 27, e: 30, c: '#C9A227', i: '✦', st: 'no' },
  ];
  const wrap = h('div', 'cal');
  let html = `<div class="cal-top"><b>Ноябрь · календарь акций</b><div class="seg two"><button data-v="1" class="on">Версия 1</button><button data-v="2">Версия 2</button></div></div>`;
  html += `<div class="cal-dow">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(d => `<span>${d}</span>`).join('')}</div>`;
  for (let w = 0; w < 5; w++) {
    html += '<div class="cal-week">';
    for (let d = 0; d < 7; d++) { const day = w * 7 + d + 1; html += `<span class="d${day > 30 ? ' off' : ''}" style="grid-column:${d + 1}">${day > 30 ? day - 30 : day}</span>`; }
    promos.forEach(p => {
      const ws = w * 7 + 1, we = w * 7 + 7;
      if (p.e < ws || p.s > we) return;
      const a = Math.max(p.s, ws) - ws + 1, b = Math.min(p.e, we) - ws + 2;
      html += `<div class="promo ${p.st}" style="grid-column:${a}/${b};background:${p.c}"><i>${p.i} </i>${p.n}</div>`;
    });
    html += '</div>';
  }
  html += `<div class="cal-leg leg1">${promos.map(p => `<span style="--c:${p.c}">${p.i} ${p.n.split(':')[0]}</span>`).join('')}</div>
    <div class="cal-leg leg2"><span style="--c:var(--accent)">Участвую</span><span style="--c:var(--soft)">Не участвую</span><span style="--c:transparent">Завершено</span></div>
    <div class="cal-note" id="calNote"></div>`;
  wrap.innerHTML = html;
  const notes = {
    1: '<b>v1:</b> цвет на каждую тематику, иконки и легенда снизу, которую почти никто не находил. Длинные названия обрезаются, а 3+ акции за две недели сливаются.',
    2: '<b>v2:</b> всего три цвета, и они показывают не тематику, а <b>статус</b>: участвую / не участвую / завершено. Без иконок, легенды и фильтров. Завершённые акции без участия скрыты.',
  };
  const note = wrap.querySelector('#calNote');
  note.removeAttribute('id');
  const set = v => { wrap.classList.toggle('v2', v === '2'); wrap.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); note.innerHTML = notes[v]; };
  wrap.querySelectorAll('.seg button').forEach(b => b.onclick = () => set(b.dataset.v));
  set('1');
  return wrap;
}

// ===== artifact =====
function openArtifact(id) {
  const g = GALLERY[id];
  $('#artTitle').textContent = g.title;
  $('#artSub').textContent = g.sub + ' · ' + g.imgs.length + ' экранов';
  $('#artLink').href = g.link;
  const body = $('#artBody');
  body.innerHTML = '';
  g.imgs.forEach(([p, cap], i) => {
    const f = h('figure', '', `<img loading="lazy" src="${img(p)}" alt="${cap || g.title}">${cap ? `<figcaption>${String(i + 1).padStart(2, '0')} · ${cap}</figcaption>` : ''}`);
    f.style.animationDelay = Math.min(i, 6) * 60 + 'ms';
    body.append(f);
  });
  body.scrollTop = 0;
  $('#app').classList.add('art-open');
}
$('#artClose').onclick = () => $('#app').classList.remove('art-open');
$('#artBody').onclick = e => { if (e.target.tagName === 'IMG') { $('#lightbox img').src = e.target.src; $('#lightbox').classList.add('open'); } };
$('#lightbox').onclick = () => $('#lightbox').classList.remove('open');

// ===== composer =====
const input = $('#input');
function setSendState() {
  const s = $('#send');
  if (S.busy) { s.disabled = false; s.classList.add('stop'); s.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" rx="2" fill="currentColor"/></svg>'; s.setAttribute('aria-label', 'Остановить'); }
  else { s.classList.remove('stop'); s.disabled = !input.value.trim(); s.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'; s.setAttribute('aria-label', 'Отправить'); }
}
function submit() {
  if (S.busy) { S.stop = true; return; }
  const v = input.value.trim();
  if (!v) return;
  const cmd = SLASH.find(c => c[0] === v.split(' ')[0]);
  input.value = ''; autosize(); closeSlash();
  if (cmd) return runCmd(cmd);
  ask(v);
}
function runCmd(cmd) {
  input.value = ''; autosize(); closeSlash(); setSendState();
  const a = cmd[2];
  if (a === '!theme') { const order = ['light', 'dark', 'system']; setTheme(order[(order.indexOf(S.theme) + 1) % 3]); toast('Тема: ' + { light: 'светлая', dark: 'тёмная', system: 'как в системе' }[S.theme]); }
  else if (a === '!clear') reset();
  else if (a === 'works') { if (S.current === 'home') threadEl(); ask(R.works.q, 'works'); }
  else open(a);
}
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }
input.addEventListener('input', () => { autosize(); setSendState(); updateSlash(); });
input.addEventListener('keydown', e => {
  const sl = $('#slash');
  if (sl.classList.contains('open')) {
    const btns = [...sl.querySelectorAll('button')];
    let i = btns.findIndex(b => b.classList.contains('on'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, j) => b.classList.toggle('on', j === i)); btns[i].scrollIntoView({ block: 'nearest' }); return; }
    if ((e.key === 'Enter' || e.key === 'Tab') && btns[i]) { e.preventDefault(); btns[i].click(); return; }
    if (e.key === 'Escape') { closeSlash(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
$('#send').onclick = submit;
// пустое поле — показываем все команды; «/…» — фильтруем
function updateSlash() {
  const v = input.value;
  const sl = $('#slash');
  const empty = v === '';
  if (S.busy || (!empty && (!v.startsWith('/') || v.includes(' ')))) return closeSlash();
  const list = empty ? SLASH : SLASH.filter(c => c[0].startsWith(v.toLowerCase()) || c[1].toLowerCase().includes(v.slice(1).toLowerCase()));
  if (!list.length) return closeSlash();
  const wasOpen = sl.classList.contains('open');
  sl.innerHTML = '<div class="slash-h">Команды</div>';
  list.forEach((c, i) => { const b = h('button', i === 0 && !empty ? 'on' : '', `<code>${c[0]}</code><span>${c[1]}</span>`); b.onclick = () => runCmd(c); sl.append(b); });
  sl.classList.add('open');
  if (!wasOpen) Sound.play('console');
}
input.addEventListener('focus', updateSlash);
input.addEventListener('click', updateSlash);
input.addEventListener('blur', closeSlash);
$('#slash').addEventListener('mousedown', e => e.preventDefault());
function closeSlash() { $('#slash').classList.remove('open'); }
function setChips(ids) {
  const c = $('#chips'); c.innerHTML = '';
  ids.forEach(id => { const r = R[id]; if (!r) return; const b = h('button', '', r.q); b.onclick = () => { if (S.busy) return; if (id === 'works') { ask(r.q, 'works'); return; } threads[id] ? open(id) : (S.current === 'free' || S.current === 'home' ? (markSeen(id), ask(r.q, id)) : open(id)); }; c.append(b); });
}
$('#attach').onclick = () => toast('Вложения пока не поддерживаются. Но оффер можно прислать в Telegram 😉');
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== input && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); input.value = '/'; updateSlash(); setSendState(); }
  if (e.key === 'Escape') { $('#app').classList.remove('art-open'); $('#lightbox').classList.remove('open'); closeMenus(); }
});

// ===== home =====
function greet() {
  const s = $('#sugg');
  [['about', 'Обо мне', 'Коротко о 8 годах в дизайне'], ['works', 'Посмотреть все кейсы', 'Продукты, исследования и цифры']]
    .forEach(([id, t, d], i) => { const b = h('button', '', `<b>${t}</b><small>${d}</small>`); b.style.animation = `rise .5s ${i * 70}ms ease both`; b.onclick = () => open(id); s.append(b); });
}
$('#logo').onclick = () => open('home');
$('#newChat').onclick = () => open('home');

// ===== settings =====
function setTheme(v) {
  S.theme = v; store.set('theme', v);
  if (v === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', v);
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
function setSpeed(v) {
  S.speed = v; store.set('speed', v);
  document.querySelectorAll('#speedSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#modelName').textContent = v === 'instant' ? 'Быстро' : 'Размышление';
  document.querySelectorAll('.model-opt').forEach(b => b.classList.toggle('on', b.dataset.s === v));
}
document.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => setTheme(b.dataset.v));
document.querySelectorAll('#speedSeg button').forEach(b => b.onclick = () => setSpeed(b.dataset.v));
function setSound(on) { Sound.on = on; store.set('sound', on); document.querySelectorAll('#soundSeg button').forEach(b => b.classList.toggle('on', (b.dataset.v === 'on') === on)); }
document.querySelectorAll('#soundSeg button').forEach(b => b.onclick = () => { setSound(b.dataset.v === 'on'); Sound.play('click'); });
document.querySelectorAll('.model-opt[data-s]').forEach(b => b.onclick = () => { setSpeed(b.dataset.s); closeMenus(); toast(b.dataset.s === 'instant' ? 'Режим «Быстро»: ответы сразу целиком' : 'Режим «Размышление»: ответы печатаются'); });
function closeMenus() { $('#pmenu').classList.remove('open'); $('#modelMenu').classList.remove('open'); }
$('#profileBtn').onclick = e => { e.stopPropagation(); $('#modelMenu').classList.remove('open'); $('#pmenu').classList.toggle('open'); };
$('#modelBtn').onclick = e => { e.stopPropagation(); $('#pmenu').classList.remove('open'); $('#modelMenu').classList.toggle('open'); };
document.addEventListener('click', e => { if (!e.target.closest('#pmenu, #modelMenu')) closeMenus(); });
function reset() {
  Object.keys(threads).forEach(k => { threads[k].remove(); delete threads[k]; });
  S.seen.clear(); store.set('seen', []); syncNav.ready = false; closeMenus(); open('home'); toast('История очищена');
}
$('#resetBtn').onclick = reset;
$('#cvLink').href = CONFIG.cv;
$('#shareBtn').onclick = () => { const u = location.href; navigator.clipboard?.writeText(u).then(() => toast('Ссылка на этот чат скопирована')).catch(() => toast(u)); };
$('#openNav').onclick = () => $('#app').classList.add('nav-open');
$('#closeNav').onclick = $('#scrim').onclick = () => $('#app').classList.remove('nav-open');
document.querySelector('.ctx-done a').onclick = e => { e.preventDefault(); open('telegram'); };

// фото профиля (если загрузится)
if (CONFIG.photo) (() => { const im = new Image(); im.onload = () => { const a = $('#ava'); a.style.backgroundImage = `url('${CONFIG.photo}')`; a.textContent = ''; }; im.src = CONFIG.photo; })();

// iOS: при открытой клавиатуре держим интерфейс в видимой области, страница не съезжает
if (window.visualViewport) {
  const vv = window.visualViewport, app = $('#app');
  let wasKb = false;
  const fit = () => {
    const kb = vv.height < window.innerHeight - 80;
    app.style.bottom = kb ? 'auto' : '';
    app.style.height = kb ? vv.height + 'px' : '';
    app.style.transform = kb && vv.offsetTop ? `translateY(${vv.offsetTop}px)` : '';
    if (kb && !wasKb && S.current !== 'home') scEl.scrollTop = scEl.scrollHeight;
    wasKb = kb;
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', fit);
}

// ===== init =====
setTheme(S.theme); setSpeed(S.speed); setSound(Sound.on);
buildNav(); greet();
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id !== S.current) open(id || 'home'); });
const startId = location.hash.slice(1);
if (startId && R[startId]) open(startId);
